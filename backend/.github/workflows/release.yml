name: Generate SDKs

on:
  release:
    types: [published]

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Setup Node
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Generate OpenAPI Spec
      run: php artisan api:generate-spec

    - name: Generate TypeScript SDK
      run: php artisan api:generate-sdk typescript

    - name: Publish to NPM
      run: echo "Publishing to NPM..."
      # working-directory: ./sdk/typescript
      # run: npm publish
